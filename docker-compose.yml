services:
  ids-app:
    # Uso normal (cualquier usuario final): usa la imagen ya publicada en Docker Hub.
    # No requiere tener el código fuente del proyecto.
    image: juancaing/ids-iot-appv2:latest

    # Uso para desarrollo (si tienes el código clonado y quieres reconstruir
    # localmente con tus propios cambios): comenta la línea "image" de arriba
    # y descomenta esta:
    # build: .

    container_name: ids-app
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
